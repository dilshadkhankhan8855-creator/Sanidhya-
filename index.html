<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffe8f4"><title>Sanidhya's Little Universe 💗</title>
<style>
:root{--pink:#ff78b7;--plum:#8d4c88;--ink:#513553;--lilac:#eadfff;--paper:#fffafd}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(145deg,#fff0f7,#f1e9ff 55%,#e8f7ff);min-height:100vh;overflow-x:hidden}#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.float{position:absolute;bottom:-30px;animation:up linear infinite;color:#e77bb4;opacity:.65}@keyframes up{to{transform:translateY(-115vh) rotate(240deg);opacity:0}}header{position:sticky;top:0;z-index:5;background:#fffaf0e8;backdrop-filter:blur(10px);padding:11px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f2cce1}.brand{font-weight:850;color:#a44f8d;font-size:.9rem}.bar{height:5px;background:#f5d8e8;border-radius:9px;flex:1;max-width:130px;overflow:hidden}.bar i{display:block;height:100%;width:4%;background:linear-gradient(90deg,#ff77b5,#b38aff)}#count{font-size:.78rem;color:#996c91;white-space:nowrap}nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;position:relative;z-index:1;scrollbar-width:thin}nav button{border:1px solid #edc6dc;background:#fff9fd;color:#94517f;border-radius:99px;padding:8px 11px;white-space:nowrap;font-size:.76rem}nav button.active{background:#ff78b7;color:white}main{position:relative;z-index:1;max-width:780px;margin:auto;padding:12px 13px 90px}.page{display:none;min-height:66vh;align-items:center;justify-content:center}.page.active{display:flex;animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.card{position:relative;width:100%;background:#ffffffdf;border:1px solid white;border-radius:27px;padding:clamp(20px,5vw,40px);text-align:center;box-shadow:0 15px 40px #8b54851a;overflow:hidden}.card:after{content:'';position:absolute;inset:8px;border:1px dashed #efb8d7;border-radius:20px;pointer-events:none}.card>*{position:relative}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:#b25e98;font-size:.72rem;font-weight:800}.emoji{font-size:3rem;display:block;margin:8px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.08;color:#b54f91;margin:12px 0}.sub{line-height:1.8;max-width:560px;margin:12px auto;font-size:1rem}.btn{border:0;border-radius:99px;padding:12px 18px;background:linear-gradient(100deg,#ff78b7,#bd8aff);color:white;font-weight:800;cursor:pointer;margin:6px;box-shadow:0 7px 18px #d67db544}.btn.light{background:#fff;color:#a64d88;border:1px solid #edc0db;box-shadow:none}.paper{background:#fff9e9;border:1px solid #f1d7a8;padding:20px;border-radius:14px;text-align:left;line-height:1.8;box-shadow:0 5px 12px #99795114}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px}.chip{padding:9px 12px;background:#fff0f8;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.slot{min-height:125px;border:2px dashed #e7a9cb;background:linear-gradient(135deg,#fff0f7,#f0e8ff);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;overflow:hidden}.slot img{width:100%;height:165px;object-fit:cover;border-radius:10px}.slot input{max-width:100%;font-size:.7rem}.slot span{font-size:1.8rem}.hint{font-size:.78rem;color:#92708d;line-height:1.5}.list{list-style:none;padding:0;text-align:left;max-width:500px;margin:16px auto}.list li{padding:10px;margin:7px 0;background:#fff0f7;border-radius:12px}.list li:before{content:'✿ ';color:#e56eaa}.heart{font-size:5rem;color:#ff70b1;animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(1.12)}}.game{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:15px auto}.star{min-height:54px;border:1px solid #e8b4d5;background:#fff0f8;border-radius:13px;font-size:1.6rem}.star.found{background:#eee1ff}.footer{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:#fffaf0ed;backdrop-filter:blur(10px);border-top:1px solid #f2cce1}.footer button{border:0;border-radius:99px;padding:10px 15px;background:#fbe5f1;color:#904b7b;font-weight:800}.footer .next{background:#ff78b7;color:#fff}.conf{position:fixed;top:-20px;z-index:20;animation:fall 2.8s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:.1}}@media(min-width:620px){.gallery{grid-template-columns:repeat(3,1fr)}.slot img{height:195px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div id="sky"></div><header><div class="brand">💗 Sanidhya's Little Universe</div><div class="bar"><i id="progress"></i></div><div id="count">1 / 24</div></header><nav id="tabs"></nav><main id="pages"></main><div class="footer"><button onclick="go(cur-1)">← Back</button><span id="bottomCount">Page 1 of 24</span><button class="next" onclick="go(cur+1)">Next →</button></div>
<script>
const data=[
['Welcome, sunshine','A little surprise for','Sanidhya 💗','I may be a little late, but a birthday wish from the heart is still full of love. Tap below and take a tiny walk through this little universe made just for you.','🌷'],
['A note from me','Dear Sanidhya…','You matter, always.','I wanted to make something more personal than a simple message. Here’s a tiny collection of kind words, wishes, and smiles—just for you.','💌'],
['The birthday moment','Make a wish!','Your day deserves magic.','Imagine a sky full of sparkles, a cake made of sweetness, and every good thing finding its way to you. You deserve all of it.','🎂'],
['A little apology','One honest thing…','I’m sorry I’m late.','I’m genuinely sorry I missed your birthday yesterday. It wasn’t because you didn’t matter. I still wanted to make something thoughtful, even if it arrived a little late. I hope this brings you a smile.','🧸'],
['What I wish for you','A pocketful of wishes','For your new year of life','More peace on hard days. More laughter that makes your cheeks hurt. More courage when things feel difficult. More people who notice your kindness—and moments where you feel proud of yourself.','🌸'],
['Your kind heart','A lovely reminder','Your kindness counts.','The little things you notice and the warmth you bring can mean more than you realise. Never think being gentle makes you weak. It’s a beautiful kind of strength.','💗'],
['For your dreams','One step at a time','I’m rooting for you.','I hope the things you quietly dream about start becoming real, one small step at a time. You don’t need everything figured out today. Keep believing in the person you’re becoming.','🌙'],
['Tiny happy things','Little joys matter','Collect the small magic.','A favourite song. Pretty colours in the sky. A funny message at the right time. A cat doing absolutely nothing. A peaceful evening. I hope life gives you many tiny reasons to smile.','✨'],
['Friendship page','A little appreciation','I’m glad we’re friends.','Some people make ordinary days brighter just by being part of them. I’m thankful for our friendship and for the moments that give us something to laugh about later.','🫶'],
['A page of cats','Official cat appreciation','Soft paws, soft hearts.','May your life always have a little cat energy: curious, cosy, quietly confident, and ready to nap when the world gets too loud.','🐱'],
['Your soundtrack','A tune just for you','Press play for a melody.','This page plays a small original melody made by your browser—no external song or download needed. Think of it as a tiny soundtrack for this birthday surprise.','🎵'],
['The compliment jar','Pick a little note','Something worth remembering.','Tap the button for a gentle reminder you might need today.','🍯'],
['A soft reminder','For the difficult days','This day won’t define you.','If a day feels heavy, you don’t have to solve your whole life at once. Take one small step, breathe, and give yourself the kindness you would give someone you care about.','☁️'],
['Photo memories','Your little gallery','Add photos you love.','Choose photos from your phone to preview in this gallery. They stay on your device in this open page; they are not uploaded anywhere. See the sharing notes after the file link.','📷'],
['Three things I hope','For this new chapter','Peace, joy, and courage.','I hope you find peace in your own company, joy in the unexpected, and courage to choose what’s right for you—even when it takes time.','🌼'],
['A tiny star game','Catch the stars','Can you find all 8?','Tap the stars. Every one is a tiny birthday wish sent your way.','⭐'],
['A letter to future you','Dear future Sanidhya…','Look how far you’ve come.','I hope you read this one day and realise how many things you made it through. Keep the parts of you that are kind, curious, and brave. Let yourself grow, too.','💫'],
['Your own little sky','Make a wish','Pick a wish from the sky.','Tap a wish and let it be your little reminder for the year ahead.','🌠'],
['Thank-you page','One little thank you','Thank you for being you.','Thank you for the laughs, the conversations, and the simple fact that you are part of this chapter of life. I hope this friendship keeps collecting good memories.','💞'],
['A mini promise','A promise for this page','More kindness, less pressure.','No need to reply with a big paragraph or make this moment perfect. Just take the good wishes, keep what makes you smile, and enjoy your day in your own way.','🕊️'],
['Birthday confetti','Let’s celebrate!','Sending you a pocket of joy.','Tap the button whenever you need a tiny burst of colour and a reminder that someone wished good things for you.','🎉'],
['A little universe','Some people make life brighter','You’re one of those people.','In this big, busy universe, I’m glad our paths crossed. I hope your world keeps getting wider, kinder, and full of things that make you feel hopeful.','🌌'],
['The final letter','Once again, Sanidhya…','Happy Birthday 💗','I hope this little surprise made you smile. I’m sorry again for the late wish, and I truly hope the year ahead brings happiness, calm, good health, lovely memories, and dreams that slowly come true. Stay kind to yourself.','💗'],
['The end… or a new memory?','Keep shining, Sanidhya','A happy birthday, bestie!','This tiny website may end here, but the wishes are for all year long. Whenever you need a reminder: you are appreciated, and I’m cheering for you.','🎀']];
const pages=document.getElementById('pages'),tabs=document.getElementById('tabs');let cur=0;
const extra=[
()=>`<button class="btn" onclick="go(1)">Let’s begin 💗</button>`,
()=>`<div class="paper"><p>Dear Sanidhya,</p><p>I know this wish is late, but I didn’t want the moment to pass without telling you that I’m wishing you so many good things.</p><p>I hope you feel loved, understood, and proud of the person you are becoming. May this year be gentle with you, full of little adventures, safe friendships, and reasons to laugh.</p><p>With warm wishes,<br>Your friend 💗</p></div>`,
()=>`<div class="chips"><span class="chip">🎂 Happiness</span><span class="chip">🌷 Peace</span><span class="chip">✨ Dreams</span></div><button class="btn" onclick="confetti()">Release the confetti 🎉</button>`,
()=>`<div class="paper">I’m sorry I missed the day itself. I hope you still feel celebrated today, tomorrow, and throughout the year. 💗</div>`,
()=>`<ul class="list"><li>More peaceful mornings</li><li>More laughter with your favourite people</li><li>More courage to try new things</li><li>More beautiful memories and little adventures</li></ul>`,
()=>`<div class="chips"><span class="chip">Kindness</span><span class="chip">Courage</span><span class="chip">Warmth</span></div>`,
()=>`<div class="paper">You don’t need to do everything at once. Tiny steps count, and your pace is allowed to be your own. 🌙</div>`,
()=>`<div class="chips"><span class="chip">🎧 Music</span><span class="chip">🌅 Sunsets</span><span class="chip">🐱 Cats</span><span class="chip">🍰 Sweet treats</span></div>`,
()=>`<div class="heart">♡</div><p class="hint">Thank you for being part of my story.</p>`,
()=>`<div class="chips"><span class="chip">🐾 Purrs</span><span class="chip">🐈 Naps</span><span class="chip">💗 Soft hearts</span></div>`,
()=>`<button class="btn" id="musicBtn" onclick="toggleMusic()">▶ Play original melody</button><p id="musicStatus" class="hint">A tiny browser-made tune, created just for this page.</p>`,
()=>`<div id="compliment" class="paper">Tap below for a reminder you might need today. 💗</div><button class="btn" onclick="compliment()">Open a note 💌</button>`,
()=>`<div class="paper">You can ask for help, take a break, and start again. You deserve kindness on ordinary days, too. ☁️</div>`,
()=>`<p class="hint">Photo picker previews photos only on the device where you select them. To make the photos visible to Sanidhya online, embed them into the HTML or publish the images alongside the page.</p><div class="gallery">${[1,2,3,4,5,6].map(n=>`<label class="slot" id="slot${n}"><span>📷</span><b>Memory ${n}</b><small>Tap to choose</small><input type="file" accept="image/*" onchange="previewPhoto(event,${n})"></label>`).join('')}</div>`,
()=>`<div class="chips"><span class="chip">Peace 🕊️</span><span class="chip">Joy 🌷</span><span class="chip">Courage ⭐</span></div>`,
()=>`<p class="hint" id="starCount">Stars found: 0 / 8</p><div class="game" id="game"></div><button class="btn light" onclick="resetGame()">Play again</button>`,
()=>`<div class="paper">Dear future Sanidhya: I hope you can see how far you’ve come. Keep the kindness, keep learning, and be proud of your small wins. 💗</div>`,
()=>`<div class="chips">${['Peace 🕊️','Joy 🌷','Courage ⭐','Adventure 🌈'].map((w,i)=>`<button class="btn light" onclick="wish(${i})">${w}</button>`).join('')}</div><p id="wishResult" class="sub">Choose a wish above ✨</p>`,
()=>`<div class="paper">Thank you for the laughs, conversations, and little moments. I hope we keep collecting good memories. 💞</div>`,
()=>`<div class="paper">No pressure to reply with a big paragraph. Just take the good wishes, keep what makes you smile, and enjoy your day your way. 🕊️</div>`,
()=>`<button class="btn" onclick="confetti()">Tap for confetti 🎉</button>`,
()=>`<div class="chips"><span class="chip">🌌 Same sky</span><span class="chip">💗 Good wishes</span><span class="chip">✨ New memories</span></div>`,
()=>`<div class="paper">Sanidhya, happy birthday! I hope this year gives you more reasons to smile than to worry, people who understand you, and moments that feel like sunshine. Sorry again that this wish came late. You deserve good things. — Your friend 🌷</div>`,
()=>`<button class="btn" onclick="confetti();go(0)">Start the journey again ↻</button>`];
data.forEach((d,i)=>{let s=document.createElement('section');s.className='page'+(!i?' active':'');s.innerHTML=`<article class="card"><div class="eyebrow">${d[0]}</div><span class="emoji">${d[4]}</span><h1>${d[1]}<br><span style="font-size:.72em">${d[2]}</span></h1><p class="sub">${d[3]}</p>${extra[i]()}${i>0&&i<23?`<button class="btn" onclick="go(${i+1})">Next little surprise →</button>`:''}</article></section>`;pages.appendChild(s);let b=document.createElement('button');b.textContent=(i+1)+'. '+d[0];b.onclick=()=>go(i);b.id='tab'+i;tabs.appendChild(b)});
function go(n){cur=Math.max(0,Math.min(23,n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===cur));document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===cur));document.getElementById('progress').style.width=((cur+1)/24*100)+'%';document.getElementById('count').textContent=(cur+1)+' / 24';document.getElementById('bottomCount').textContent='Page '+(cur+1)+' of 24';window.scrollTo({top:0,behavior:'smooth'});if(cur===15&&!document.getElementById('game').children.length)resetGame()}
function confetti(){let a=['💗','🌸','✨','🎀','💜','🌷'];for(let i=0;i<42;i++){let e=document.createElement('span');e.className='conf';e.textContent=a[Math.random()*a.length|0];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()+ 's';e.style.fontSize=14+Math.random()*16+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
function previewPhoto(e,n){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let s=document.getElementById('slot'+n),img=s.querySelector('img');if(!img){img=document.createElement('img');s.insertBefore(img,e.target)}img.src=r.result;s.querySelector('span').style.display='none';s.querySelector('b').textContent=f.name;s.querySelector('small').style.display='none'};r.readAsDataURL(f)}
function compliment(){let a=['You deserve kindness, especially from yourself. 💗','You don’t have to be perfect to be appreciated. 🌷','Small steps still move you forward. ⭐','Your feelings matter, too. ☁️','You can rest without earning it first. 🧸','You bring your own kind of light. ✨'];document.getElementById('compliment').textContent=a[Math.random()*a.length|0]}
function wish(i){document.getElementById('wishResult').textContent=['May you find peace when life feels loud. 🕊️','May little joys find you every week. 🌷','May you trust yourself through new things. ⭐','May you collect beautiful new memories. 🌈'][i];confetti()}
function resetGame(){let area=document.getElementById('game');area.innerHTML='';let count=0;let vals=['⭐','🌟','💫','✨','🌠','💖','🌷','🪄','☁️','🌙','💗','🎀'];vals.forEach(v=>{let b=document.createElement('button');b.className='star';b.textContent='?';b.onclick=()=>{if(b.classList.contains('found'))return;b.classList.add('found');b.textContent=v;count++;document.getElementById('starCount').textContent='Stars found: '+count+' / 8';if(count>=8){document.getElementById('starCount').textContent='You found the magic! ✨ 8 wishes for you 💗';confetti()}};area.appendChild(b)})}
let ctx=null,music=false,timer=null;function toggleMusic(){let btn=document.getElementById('musicBtn');if(music){music=false;clearInterval(timer);ctx&&ctx.suspend();btn.textContent='▶ Play original melody';document.getElementById('musicStatus').textContent='Melody paused.';return}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();music=true;btn.textContent='⏸ Pause melody';document.getElementById('musicStatus').textContent='Playing a soft original tune. 🎵';let seq=[523,659,784,659,587,698,880,698],j=0;function note(){if(!music)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=seq[j++%seq.length];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.06,ctx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.28);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)}note();timer=setInterval(note,360)}catch(e){document.getElementById('musicStatus').textContent='Audio is not available in this browser.'}}
for(let i=0;i<28;i++){let e=document.createElement('span');e.className='float';e.textContent=['✦','♡','✧','🌸'][i%4];e.style.left=Math.random()*100+'%';e.style.animationDuration=5+Math.random()*8+'s';e.style.animationDelay=Math.random()*8+'s';e.style.fontSize=12+Math.random()*18+'px';document.getElementById('sky').appendChild(e)}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});go(0);
</script></body></html>
